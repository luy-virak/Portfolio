// Interconnected Cobblestone Pathways connecting the three landmark stores
function createCobblestonePath(points, count = 18) {
  const curve = new THREE.CatmullRomCurve3(points);
  const pts = curve.getPoints(count);
  pts.forEach((pt, i) => {
    const stoneW = 1.0 + Math.sin(i * 0.8) * 0.25;
    const stoneL = 0.85 + Math.cos(i * 0.5) * 0.2;
    const stoneGeom = new THREE.BoxGeometry(stoneW, 0.08, stoneL);
    const stoneColor = (i % 2 === 0) ? 0xede2d2 : 0xe2d6c3;
    const stoneMat = new THREE.MeshLambertMaterial({ color: stoneColor });
    const stone = new THREE.Mesh(stoneGeom, stoneMat);
    stone.position.set(pt.x, 0.04, pt.z);
    stone.rotation.y = (i * 0.15);
    stone.receiveShadow = true;
    worldGroup.add(stone);
  });
}

function createDetailedTallTree(x, z, scale = 1.0) {
  const tree = new THREE.Group();

  const foliageTints = [0x285632, 0x33683e, 0x3d7b4a, 0x4e8d5b];
  const layerCount = 4;
  for (let l = 0; l < layerCount; l++) {
    const bottomRadius = (2.2 - l * 0.38) * scale;
    const height = (1.9 - l * 0.2) * scale;
    const fGeom = new THREE.ConeGeometry(bottomRadius, height, 7);

    fMesh.position.y = (1.8 + l * 1.15) * scale;
    fMesh.castShadow = true;
    fMesh.receiveShadow = true;
    tree.add(fMesh);
  }

  tree.position.set(x, 0, z);
  return tree;
}

// DYNAMIC FLOATING DISTANCE MARKERS (For "My Work" and "Contact" landmark houses)
function createDistanceMarker(title, tagColor, initialDist = '15.0m') {
  const markerGroup = new THREE.Group();

  // Create canvas texture
  const canvas = document.createElement('canvas');
  canvas.width = 384;
  canvas.height = 144;
  const ctx = canvas.getContext('2d');

  function renderMarkerContent(distText) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Warm Parchment Pill Background with subtle border
    ctx.fillStyle = '#f7eedf';
    ctx.beginPath();
    ctx.roundRect(16, 12, 352, 100, 24);
    ctx.fill();

    // Subtle kraft border
    ctx.strokeStyle = '#dfcbb4';
    ctx.lineWidth = 4;
    ctx.stroke();

    // Top Category / Title
    ctx.fillStyle = tagColor;
    ctx.font = 'bold 24px Epilogue, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(title.toUpperCase(), 192, 48);

    // Distance Value
    ctx.fillStyle = '#2c221e';
    ctx.font = 'bold 36px Epilogue, monospace, sans-serif';
    ctx.fillText(distText, 192, 92);

    // Downward pointer arrow notch
    ctx.fillStyle = '#f7eedf';
    ctx.beginPath();
    ctx.moveTo(174, 112);
    ctx.lineTo(210, 112);
    ctx.lineTo(192, 132);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#dfcbb4';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  renderMarkerContent(initialDist);

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;

  // Use a Sprite so it always billboard-faces the camera seamlessly
  const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(4.8, 1.8, 1);
  markerGroup.add(sprite);

  // Little low-poly diamond anchor pin below the sprite
  const pinGeom = new THREE.OctahedronGeometry(0.24, 0);
  const pinMat = new THREE.MeshLambertMaterial({ color: 0xd3543a });
  const pin = new THREE.Mesh(pinGeom, pinMat);
  pin.position.y = -1.1;
  markerGroup.add(pin);

  markerGroup.userData = {
    canvas,
    ctx,
    texture,
    renderMarkerContent,
    lastDistance: null
  };

  return markerGroup;
}

// Markers placed above "My Work" and "Contact"
const activeDistanceMarkers = [
  {
    name: 'My Work',
    color: '#2d587b', // Slate indigo blue
    pos: new THREE.Vector3(11.5, 7.0, -2.5),
    worldPos: new THREE.Vector3(11.5, 0, -2.5)
  },
  {
    name: 'Contact',
    color: '#c45e22', // Amber terracotta
    pos: new THREE.Vector3(3.5, 7.4, 12.8),
    worldPos: new THREE.Vector3(3.5, 0, 12.8)
  }
];

activeDistanceMarkers.forEach((lm) => {
  const marker = createDistanceMarker(lm.name, lm.color, '0.0m');
  marker.position.copy(lm.pos);
  lm.markerMesh = marker;
  worldGroup.add(marker);
});

// FLUFFY FLOATING CLOUDS
const cloudsGroup = new THREE.Group();
const cloudPuffMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.92 });

function createFluffyCloud(scale = 1.0) {
  const cloud = new THREE.Group();
  const puffCount = 5 + Math.floor(Math.random() * 3);
  for (let p = 0; p < puffCount; p++) {
    const r = (1.4 + Math.random() * 0.9) * scale;
    const puff = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 1), cloudPuffMat);
    puff.position.set(
      (p - puffCount / 2) * 1.5 * scale,
      Math.sin(p * 1.2) * 0.45 * scale,
      (Math.random() - 0.5) * 1.2 * scale
    );
    puff.castShadow = true;
    cloud.add(puff);
  }
  return cloud;
}

const cloudConfigs = [
  { x: -28, y: 15, z: -15, s: 1.25, speed: 0.007 },
  { x: 26, y: 17, z: -18, s: 1.4, speed: 0.009 },
  { x: 30, y: 13, z: 12, s: 1.1, speed: 0.006 },
  { x: -26, y: 18, z: 16, s: 1.35, speed: 0.008 },
  { x: 0, y: 21, z: -29, s: 1.5, speed: 0.005 },
  { x: -16, y: 14, z: 27, s: 1.15, speed: 0.0075 },
  { x: 20, y: 19, z: 25, s: 1.2, speed: 0.0065 }
];

cloudConfigs.forEach((cfg) => {
  const cloud = createFluffyCloud(cfg.s);
  cloud.position.set(cfg.x, cfg.y, cfg.z);
  cloud.userData = { speed: cfg.speed, baseY: cfg.y };
  cloudsGroup.add(cloud);
});
scene.add(cloudsGroup);

// Playable Character
const character = new THREE.Group();
character.position.set(0, 0, 5.5);
worldGroup.add(character);

const bodyGeom = new THREE.BoxGeometry(0.85, 0.95, 0.55);
const bodyMat = new THREE.MeshLambertMaterial({ color: 0xd3543a });
const charBody = new THREE.Mesh(bodyGeom, bodyMat);
charBody.position.y = 0.95;
charBody.castShadow = true;
character.add(charBody);

const headGeom = new THREE.BoxGeometry(0.66, 0.66, 0.66);
const headMat = new THREE.MeshLambertMaterial({ color: 0xffdfbe });
const charHead = new THREE.Mesh(headGeom, headMat);
charHead.position.y = 1.8;
charHead.castShadow = true;
character.add(charHead);

const hatGeom = new THREE.ConeGeometry(0.6, 0.55, 6);
const hatMat = new THREE.MeshLambertMaterial({ color: 0x394f3e });
const hat = new THREE.Mesh(hatGeom, hatMat);
hat.position.y = 2.35;
hat.rotation.y = Math.PI / 6;
character.add(hat);

const legGeom = new THREE.BoxGeometry(0.28, 0.56, 0.28);
const legMat = new THREE.MeshLambertMaterial({ color: 0x242d38 });

const leftLeg = new THREE.Mesh(legGeom, legMat);
leftLeg.position.set(-0.24, 0.28, 0);
leftLeg.castShadow = true;
character.add(leftLeg);

const rightLeg = new THREE.Mesh(legGeom, legMat);
rightLeg.position.set(0.24, 0.28, 0);
rightLeg.castShadow = true;
character.add(rightLeg);

const armGeom = new THREE.BoxGeometry(0.2, 0.62, 0.2);
const armMat = new THREE.MeshLambertMaterial({ color: 0xd3543a });

const leftArm = new THREE.Mesh(armGeom, armMat);
leftArm.position.set(-0.52, 0.9, 0);
leftArm.castShadow = true;
character.add(leftArm);

const rightArm = new THREE.Mesh(armGeom, armMat);
rightArm.position.set(0.52, 0.9, 0);
rightArm.castShadow = true;
character.add(rightArm);

// Movement & Interaction
const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
let targetPosition = null;
const moveSpeed = 6.4;
const rotateSpeed = 8.5;
let walkCycle = 0;
let isMoving = false;

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener('keydown', (e) => {
  if (keys.hasOwnProperty(e.key.toLowerCase())) {
    keys[e.key.toLowerCase()] = true;
    targetPosition = null;
  }
  if (keys.hasOwnProperty(e.key)) {
    keys[e.key] = true;
    targetPosition = null;
  }
});

window.addEventListener('keyup', (e) => {
  if (keys.hasOwnProperty(e.key.toLowerCase())) {
    keys[e.key.toLowerCase()] = false;
  }
  if (keys.hasOwnProperty(e.key)) {
    keys[e.key] = false;
  }
});

// Click / tap to navigate
renderer.domElement.addEventListener('pointerdown', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(islandMesh);
  if (intersects.length > 0) {
    const pt = intersects[0].point;
    const dist = Math.sqrt(pt.x * pt.x + pt.z * pt.z);
    if (dist < islandRadius - 1.6) {
      targetPosition = new THREE.Vector3(pt.x, 0, pt.z);
    }
  }
});

// Global navigation hooks connected to the bottom 3D box controls
window.characterNavigateTo = function(x, z) {
  targetPosition = new THREE.Vector3(x, 0, z);
};

window.navigateToAbout = () => window.characterNavigateTo(-10, -1);
window.navigateToProjects = () => window.characterNavigateTo(10, -1);
window.navigateToContact = () => window.characterNavigateTo(3.2, 10.5);

// Animation Loop
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.1);
  const elapsed = clock.getElapsedTime();

  // Floating clouds gentle drift
  cloudsGroup.children.forEach((cloud) => {
    cloud.position.x += cloud.userData.speed * 60 * delta;
    cloud.position.y = cloud.userData.baseY + Math.sin(elapsed * 1.2 + cloud.position.x * 0.1) * 0.5;
    if (cloud.position.x > 38) cloud.position.x = -38;
  });

  // Character movement
  let moveX = 0;
  let moveZ = 0;

  if (keys.w || keys.arrowup) moveZ -= 1;
  if (keys.s || keys.arrowdown) moveZ += 1;
  if (keys.a || keys.arrowleft) moveX -= 1;
  if (keys.d || keys.arrowright) moveX += 1;

  isMoving = false;

  if (moveX !== 0 || moveZ !== 0) {
    const inputDir = new THREE.Vector2(moveX, moveZ).normalize();
    const newX = character.position.x + inputDir.x * moveSpeed * delta;
    const newZ = character.position.z + inputDir.y * moveSpeed * delta;

    const radius = Math.sqrt(newX * newX + newZ * newZ);
    if (radius < islandRadius - 1.5) {
      character.position.x = newX;
      character.position.z = newZ;
    }

    const targetRot = Math.atan2(inputDir.x, inputDir.y);
    character.rotation.y += (targetRot - character.rotation.y) * rotateSpeed * delta;
    isMoving = true;
  } else if (targetPosition) {
    const dir = new THREE.Vector3().subVectors(targetPosition, character.position);
    dir.y = 0;
    const distance = dir.length();
    
    if (distance > 0.18) {
      dir.normalize();
      character.position.x += dir.x * moveSpeed * delta;
      character.position.z += dir.z * moveSpeed * delta;
      
      const targetRot = Math.atan2(dir.x, dir.z);
      character.rotation.y += (targetRot - character.rotation.y) * rotateSpeed * delta;
      isMoving = true;
    } else {
      targetPosition = null;
    }
  }

  // Refined natural walk cycle
  if (isMoving) {
    walkCycle += delta * 12;
    leftLeg.rotation.x = Math.sin(walkCycle) * 0.6;
    rightLeg.rotation.x = -Math.sin(walkCycle) * 0.6;
    leftArm.rotation.x = -Math.sin(walkCycle) * 0.5;
    rightArm.rotation.x = Math.sin(walkCycle) * 0.5;
    charBody.position.y = 0.95 + Math.abs(Math.sin(walkCycle * 2)) * 0.07;
    charHead.position.y = 1.8 + Math.abs(Math.sin(walkCycle * 2)) * 0.07;
  } else {
    leftLeg.rotation.x = 0;
    rightLeg.rotation.x = 0;
    leftArm.rotation.x = 0;
    rightArm.rotation.x = 0;
    charBody.position.y = 0.95 + Math.sin(elapsed * 2.2) * 0.015;
    charHead.position.y = 1.8 + Math.sin(elapsed * 2.2) * 0.02;
  }

  // Dynamic distance calculation and floating marker update for "My Work" and "Contact"
  activeDistanceMarkers.forEach((lm, index) => {
    if (lm.markerMesh) {
      // Gentle floating bob
      lm.markerMesh.position.y = lm.pos.y + Math.sin(elapsed * 2.4 + index * 1.5) * 0.22;

      // Distance calculation in meters (1 unit = 1 meter)
      const dx = character.position.x - lm.worldPos.x;
      const dz = character.position.z - lm.worldPos.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      const roundedDist = dist.toFixed(1) + 'm';

      // Update canvas texture only if value changed
      const uData = lm.markerMesh.userData;
      if (uData && uData.lastDistance !== roundedDist) {
        uData.lastDistance = roundedDist;
        uData.renderMarkerContent(roundedDist);
        uData.texture.needsUpdate = true;
      }
    }
  });

  // Smooth camera tracking
  const idealCamPos = new THREE.Vector3(
    character.position.x * 0.42,
    21.0,
    character.position.z * 0.42 + 28.5
  );
  camera.position.lerp(idealCamPos, delta * 3.0);
  camera.lookAt(character.position.x * 0.28, 2.0, character.position.z * 0.28);

  renderer.render(scene, camera);
}

animate();

// Resize
function onWindowResize() {
  const newW = containerElement.clientWidth || window.innerWidth;
  const newH = containerElement.clientHeight || window.innerHeight;
  camera.aspect = newW / newH;
  camera.updateProjectionMatrix();
  renderer.setSize(newW, newH);
}
window.addEventListener('resize', onWindowResize);
})();
</script>
